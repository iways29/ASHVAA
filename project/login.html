<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASHVAA — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .login-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 48px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .login-logo {
      font-family: var(--disp);
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .login-logo .dot {
      color: var(--acc);
    }

    .login-tagline {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--mut);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 32px 0;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .login-divider span {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--faint);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .login-form {
      text-align: left;
    }

    .login-field {
      margin-bottom: 20px;
    }

    .login-btn {
      width: 100%;
      margin-top: 8px;
    }

    .login-footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .login-footer p {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
    }

    .login-footer a {
      color: var(--acc);
      text-decoration: underline;
    }

    .oauth-btn {
      width: 100%;
      background: var(--bg);
      margin-bottom: 12px;
    }

    .oauth-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Background decoration */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--line2) 1px, transparent 1px),
        linear-gradient(90deg, var(--line2) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.5;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 54, 46, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="wrap">
      <a href="ASHVAA%20Editorial.html" class="brand">
        <span class="logo">ASHVAA<span class="dot">.</span></span>
      </a>
    </div>
  </header>

  <!-- Login Content -->
  <main class="login-page">
    <div class="login-card">
      <div class="login-logo">ASHVAA<span class="dot">.</span></div>
      <p class="login-tagline">Codebase Intelligence Platform</p>

      <!-- Demo mode notice -->
      <div style="
        background: rgba(255,54,46,0.07);
        border: 1px solid rgba(255,54,46,0.25);
        border-radius: 6px;
        padding: 16px;
        margin-bottom: 28px;
        text-align: left;
      ">
        <p style="font-family: var(--mono); font-size: 11px; color: var(--acc); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px;">Open Source Demo</p>
        <p style="font-family: var(--mono); font-size: 12px; color: var(--mut); line-height: 1.6;">
          This login screen is a UI sample — no auth is wired up. Clone the repo, drop your <code style="color: var(--ink); background: var(--bg); padding: 1px 4px; border-radius: 3px;">ANTHROPIC_API_KEY</code> and <code style="color: var(--ink); background: var(--bg); padding: 1px 4px; border-radius: 3px;">GITHUB_TOKEN</code> into <code style="color: var(--ink); background: var(--bg); padding: 1px 4px; border-radius: 3px;">.env</code>, then hit the button below.
        </p>
      </div>

      <button class="btn btn-fill login-btn" onclick="window.location.href='dashboard.html'">
        Enter the App &rarr;
      </button>

      <div class="login-footer">
        <p>
          Open source &mdash;
          <a href="https://github.com/TheUnrealLab/ASHVAA" target="_blank" rel="noopener">clone &amp; self-host on GitHub</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>
